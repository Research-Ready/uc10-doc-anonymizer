project:
  type: book
  output-dir: _book

book:
  title: "UC10 Document Anonymizer"
  subtitle: "PDF / DOCX in → the same file out, people and target company masked, fully local"
  date: "2026-10-01"
  chapters:
    - index.qmd
    - workflow.qmd
    - part: "System Design"
      chapters:
        - architecture.qmd
    - part: "Operations"
      chapters:
        - plan.qmd
        - requirements.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true

execute:
  echo: false
  warning: false
