# ==============================================================================
# UC10 Document Anonymizer — Standalone Docker Compose Stack
# Fully Local Processing — Zero Cloud LLMs — 100% Offline Capable
# ==============================================================================

services:
  # ── UC10 Presidio + spaCy NER service ────────────────────────────────────────
  uc10-anonymizer:
    build:
      context: ./service
      dockerfile: Dockerfile
    image: uc10-anonymizer:latest
    container_name: uc10-anonymizer
    restart: unless-stopped
    environment:
      DOCLING_URL: http://docling:5001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-secret-neo4j-password}
    mem_limit: 3g  # spaCy Dutch + English models require min 2.5 GB RAM
    volumes:
      - ./service:/app:ro,z
    ports:
      - "${LOCALSTACK_BIND:-127.0.0.1}:5010:5002"
    depends_on:
      neo4j:
        condition: service_healthy
      docling:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Docling document parser (PDF & DOCX -> Markdown) ─────────────────────────
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.35.0
    container_name: uc10-docling
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_BIND:-127.0.0.1}:5001:5001"

  # ── Neo4j entity registry (cross-document persistent pseudonym labels) ───────
  neo4j:
    image: neo4j:5-community
    container_name: uc10-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-secret-neo4j-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    ports:
      - "${LOCALSTACK_BIND:-127.0.0.1}:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Web Control Dashboard (Port 5050) ────────────────────────────────────────
  uc10-dashboard:
    build:
      context: .
      dockerfile: scripts/Dockerfile.dashboard
    image: uc10-dashboard:latest
    container_name: uc10-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:5050:5050"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      UC10_URL: http://uc10-anonymizer:5002   # used by SAY GO (anonymize_folder.py) inside this container
      ANONYMIZER_HEALTH_URL: http://uc10-anonymizer:5002/health
      DOCLING_HEALTH_URL: http://docling:5001/health
      NEO4J_HTTP_URL: http://neo4j:7474
    volumes:
      - ./input:/app/input:z
      - ./output:/app/output:z
      - ./keys:/app/keys:z
      - ./scripts:/app/scripts:ro,z
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - uc10-anonymizer

volumes:
  neo4j_data:
